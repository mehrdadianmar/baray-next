name: Test Baray Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test WordPress integration
        run: npm run test:wordpress
      - name: Sync published WordPress posts
        run: npm run content:sync:strict
        env:
          WORDPRESS_API_URL: https://www.baray.ir/wp-json/wp/v2
          WORDPRESS_POST_LIMIT: 100
      - name: Typecheck
        run: npm run typecheck
      - name: Build test site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://mehrdadianmar.github.io/baray-next
          NEXT_PUBLIC_BASE_PATH: /baray-next
          NEXT_PUBLIC_NOINDEX: "true"
      - name: SEO and link audit
        run: npm run audit
        env:
          NEXT_PUBLIC_SITE_URL: https://mehrdadianmar.github.io/baray-next
          NEXT_PUBLIC_BASE_PATH: /baray-next
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
