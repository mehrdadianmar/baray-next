<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">داشبورد هوش تجاری بارای</title><desc id="desc">نمای گرافیکی از شاخص‌ها، نمودارها و گزارش مدیریتی</desc>
