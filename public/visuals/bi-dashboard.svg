  <g font-family="Tahoma, sans-serif"><g><rect x="84" y="144" width="180" height="104" rx="14" fill="#e9f7f3"/><text x="238" y="176" text-anchor="end" font-size="12" fill="#577170">پرونده‌های فعال</text><text x="238" y="220" text-anchor="end" font-size="34" font-weight="700" fill="#087c6e">۲۸۴</text></g><g><rect x="282" y="144" width="180" height="104" rx="14" fill="#fff4df"/><text x="436" y="176" text-anchor="end" font-size="12" fill="#776a52">موعد نزدیک</text><text x="436" y="220" text-anchor="end" font-size="34" font-weight="700" fill="#d58825">۳۶</text></g><g><rect x="480" y="144" width="180" height="104" rx="14" fill="#eaf0f6"/><text x="634" y="176" text-anchor="end" font-size="12" fill="#5a6d7b">نرخ اقدام در موعد</text><text x="634" y="220" text-anchor="end" font-size="34" font-weight="700" fill="#183d56">۷۸٪</text></g><g><rect x="678" y="144" width="198" height="104" rx="14" fill="#09282d"/><text x="850" y="176" text-anchor="end" font-size="12" fill="#a8c0bd">ریسک کنترل‌شده</text><text x="850" y="220" text-anchor="end" font-size="34" font-weight="700" fill="#55e0c1">+۲۴٪</text></g></g>
